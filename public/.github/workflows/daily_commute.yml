
name: Daily Metro Commute Generator

on:
  schedule:
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-commute
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set episode date and URLs
        id: episode
        shell: bash
        run: |
          echo "date=$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"
          echo "tag=commute-$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"

      - name: Generate daily commute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          AUDIO_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/commute-${{ steps.episode.outputs.date }}
        run: python generate_commute.py

      - name: Verify generated files
        shell: bash
        run: |
          test -s "public/episodes/commute_${{ steps.episode.outputs.date }}.mp3"
          test -s public/feed.xml
          echo "Episode and RSS feed generated successfully."

      - name: Publish episode to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.episode.outputs.tag }}
          name: Metro Commute ${{ steps.episode.outputs.date }}
          target_commitish: ${{ github.sha }}
          files: public/episodes/commute_${{ steps.episode.outputs.date }}.mp3
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated generation state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update commute state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Prepare Pages feed
        run: |
          mkdir -p pages
          cp public/feed.xml pages/feed.xml

      - name: Publish RSS feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pages
          force_orphan: true
